name: Build RMK firmware (Primer29)

on:
  push:
    paths:
      - "rmk/**"
      - ".github/workflows/build-rmk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # rmk-types のコンパイルで rustc がスタックオーバーフローするのを防ぐ (32MB)
      RUST_MIN_STACK: "33554432"
    defaults:
      run:
        working-directory: rmk
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
          components: llvm-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rmk

      - name: Install build tools (flip-link, cargo-binutils, cargo-hex-to-uf2)
        run: cargo install flip-link cargo-binutils cargo-hex-to-uf2

      - name: Build
        run: cargo build --release

      # keyboard.toml の [rmk] が実際にビルドへ効いたかの検証。
      # KEYBOARD_TOML_PATH が届かないと rmk の build.rs は既定値でビルドを通してしまい、
      # コンボが 8 個のままの uf2 が黙って出来上がるため、生成物を直接確認する。
      - name: Verify combo_max_num from keyboard.toml is applied
        run: |
          grep -R --include=constants.rs -H 'COMBO_MAX_NUM\|COMBO_MAX_LENGTH' target || true
          grep -Rq --include=constants.rs 'COMBO_MAX_NUM: usize = 128;' target \
            || { echo "::error::COMBO_MAX_NUM != 128 (keyboard.toml / KEYBOARD_TOML_PATH not applied)"; exit 1; }

      - name: Generate HEX
        run: cargo objcopy --release -- -O ihex primer29.hex

      - name: Convert to UF2
        run: cargo hex-to-uf2 --input-path primer29.hex --output-path primer29.uf2 --family rp2040

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: primer29-rmk-uf2
          path: rmk/primer29.uf2
